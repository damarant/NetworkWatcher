<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetworkWatcher - Change Password</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            color: #4ecca3;
            margin-top: 0;
            text-align: center;
            font-size: 1.5em;
        }
        .warning {
            background: #f0a500;
            color: #1a1a2e;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9em;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #0f3460;
            border: 1px solid #1a4080;
            border-radius: 6px;
            color: #eee;
            font-size: 1em;
        }
        input:focus {
            outline: none;
            border-color: #4ecca3;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #3dbb92;
        }
        .error, .info {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
            font-size: 0.9em;
        }
        .error {
            background: #e94560;
            color: white;
        }
        .info {
            background: #4ecca3;
            color: #1a1a2e;
        }
        .error.show, .info.show {
            display: block;
        }
        .hint {
            color: #666;
            font-size: 0.8em;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#128274; Change Password</h1>

        <div class="warning">
            You must change the password before continuing
        </div>

        <div class="error" id="error">Error: wrong current password, passwords do not match, or new password too short (min 8 characters)</div>

        <form id="pwdForm">
            <label for="old_pass">Current password</label>
            <input type="password" id="old_pass" required autofocus>

            <label for="new_pass">New password (min 8 characters)</label>
            <input type="password" id="new_pass" required minlength="8">

            <label for="confirm_pass">Confirm new password</label>
            <input type="password" id="confirm_pass" required minlength="8">

            <button type="submit">Change Password</button>
        </form>

        <p class="hint">
            <a href="/api/logout" style="color: #4ecca3;">Logout</a>
        </p>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        function showError(text) {
            const e = $('error');
            e.textContent = text;
            e.classList.add('show');
        }

        function hideError() {
            $('error').classList.remove('show');
        }

        // Show error from URL parameter (?error=1)
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            showError('Error: wrong current password, passwords do not match, or new password too short (min 8 characters)');
        }

        // Handle form submit via fetch (to show specific errors)
        $('pwdForm').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            hideError();

            const old_pass = $('old_pass').value;
            const new_pass = $('new_pass').value;
            const confirm = $('confirm_pass').value;

            if (!old_pass || !new_pass || !confirm) {
                showError('Please fill in all fields');
                return;
            }
            if (new_pass !== confirm) {
                showError('Passwords do not match');
                return;
            }
            if (new_pass.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }

            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;

            try {
                const body = `old_pass=${encodeURIComponent(old_pass)}&new_pass=${encodeURIComponent(new_pass)}`;
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body,
                    redirect: 'follow'
                });

                if (res.redirected || res.ok) {
                    // The server redirects to /setup or / on success
                    window.location.href = res.url;
                } else {
                    showError('Error: wrong current password or invalid new password');
                    btn.disabled = false;
                }
            } catch (e) {
                showError('Network error: ' + e.message);
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
